aid: supper
name: Supper
description: >-
  Supper is an AI data agent for high-growth companies that connects a company's
  data, cleans it, and maps its business language so teams can answer critical
  questions in plain English within minutes. Supper reads from the customer's
  warehouse (Snowflake, BigQuery, Postgres, Redshift) and SaaS tools (CRM, ERP,
  marketing, product, payments) over a read-only connection, builds a verified
  semantic model, and exposes a hosted, OAuth-secured MCP server so any
  MCP-compatible AI assistant such as Claude can query that data via natural
  language and return dashboards and answers grounded in that model.
