- name: get_pipeline_status
  description: Check the processing status for complex / long-running queries.
- name: get_answer_rows
  description: Retrieve structured row data from a completed answer - columnar format, ready to act on.
- name: get_context
  description: Retrieve semantic model context - metric definitions, entity descriptions, available tables.
